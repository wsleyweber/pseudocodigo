<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Pseudocódigo > JS</title>
<meta name="description" content="Escreva seus algoritmos e execute no navegador.">
<style>
:root {
  /* superfícies */
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --line: #e4e7ec;
  --line-strong: #cdd3dc;
  /* texto */
  --text: #1b2130;
  --muted: #667085;
  /* acento e estados */
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-ink: #ffffff;
  --accent-soft: rgba(79, 70, 229, .12);
  --danger: #d92d20;
  --ok: #12a150;
  --warn: #d9920b;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  /* saída (terminal) */
  --term-bg: #10151d;
  --term-text: #e6eaf2;
  --term-muted: #8993a5;
  --term-input: #f3d27a;
  --term-err: #ff8f8f;
  --term-warn: #ffc27d;
  --term-borda: rgba(16, 21, 29, .9);
  /* realce de sintaxe */
  --c-kw: #5b3fd1;
  --c-tipo: #0b7a75;
  --c-fn: #1d6fb8;
  --c-str: #b4541a;
  --c-num: #b0305c;
  --c-com: #6b7280;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --fs: 14px;
  --lh: 22px;
  --pad: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --surface: #151b24;
    --surface-2: #121820;
    --line: #262e3a;
    --line-strong: #364152;
    --text: #e6edf3;
    --muted: #8b95a7;
    --accent: #818cf8;
    --accent-hover: #9aa4ff;
    --accent-ink: #0d1117;
    --accent-soft: rgba(129, 140, 248, .16);
    --danger: #ff7b72;
    --ok: #3fb950;
    --warn: #e3b341;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --term-bg: #0a0e14;
    --term-borda: #2a3342;
    --c-kw: #b69bff;
    --c-tipo: #56d4c9;
    --c-fn: #79b8ff;
    --c-str: #f0a36b;
    --c-num: #ff8fb1;
    --c-com: #8b95a7;
  }
}
@media (max-width: 860px) {
  :root { --fs: 16px; --lh: 26px; }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
@media (min-width: 861px) {
  body { height: 100vh; height: 100dvh; }
}
.wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: 24px; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- topo ---------- */
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-top: 20px; padding-bottom: 4px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
}
.logo svg { width: 18px; height: 18px; }
.topo h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.topo h1 span { color: var(--muted); font-weight: 500; }
.topo p { margin: 0; flex: 1 1 240px; color: var(--muted); font-size: 14px; }
.github {
  color: var(--muted); font-size: 13.5px; text-decoration: none;
  padding: 5px 9px; margin-right: -9px; border-radius: 7px;
  transition: color .12s, background-color .12s;
}
.github:hover { color: var(--text); background: var(--accent-soft); }

/* ---------- barra de ações ---------- */
.barra {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px;
  padding-top: 14px; padding-bottom: 16px;
}
.grupo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

button, select {
  font: inherit; font-size: 13.5px; color: var(--text);
  height: 34px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow); cursor: pointer;
  transition: background-color .12s, border-color .12s, box-shadow .12s, transform .06s;
}
button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 0 13px; white-space: nowrap;
}
button svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface-2); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled, select:disabled { opacity: .45; cursor: default; box-shadow: none; }
button.principal { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.principal svg { fill: currentColor; stroke: none; }
button.principal:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

.seletor { position: relative; display: inline-block; }
.seletor select {
  -webkit-appearance: none; appearance: none;
  padding: 0 34px 0 13px; max-width: 240px; text-overflow: ellipsis;
}
.seletor::after {
  content: ""; position: absolute; right: 14px; top: 50%;
  width: 6px; height: 6px; pointer-events: none;
  border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
}

/* ---------- painéis ---------- */
.paineis {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px;
  padding-bottom: 8px;
}
.painel { display: flex; flex-direction: column; min-height: 0; }
.cab { display: flex; align-items: center; justify-content: space-between; min-height: 28px; margin: 0 2px 8px; }
.cab h2 { margin: 0; font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.estado {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--muted);
  padding: 3px 11px 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
}
.estado::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--ponto, #98a2b3);
}
.estado[data-estado="executando"] { --ponto: var(--warn); }
.estado[data-estado="executando"]::before { animation: pulso 1.1s ease-in-out infinite; }
.estado[data-estado="entrada"] { --ponto: var(--accent); }
.estado[data-estado="ok"] { --ponto: var(--ok); }
.estado[data-estado="erro"] { --ponto: var(--danger); }
@keyframes pulso { 50% { opacity: .3; } }

/* ---------- editor ---------- */
.editor {
  flex: 1; min-height: 0; display: flex; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow);
  font: var(--fs) / var(--lh) var(--mono);
  font-variant-ligatures: none;
  transition: border-color .15s, box-shadow .15s;
}
.editor:focus-within {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.numeros {
  flex: none; overflow: hidden; margin: 0;
  width: calc(var(--ndig, 2) * 1ch + 30px);
  padding: var(--pad) 12px calc(var(--pad) + 80px) 0;
  text-align: right; white-space: pre; user-select: none;
  color: color-mix(in srgb, var(--muted) 75%, transparent);
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  font: inherit;
}
.numeros .erro { color: var(--danger); font-weight: 700; }
.codigo { position: relative; flex: 1; min-width: 0; }

.camada, .codigo textarea {
  position: absolute; inset: 0; margin: 0; border: 0;
  padding: var(--pad) 16px calc(var(--pad) + 80px) 16px;
  font: inherit; font-variant-ligatures: none;
  tab-size: 4; white-space: pre; word-wrap: normal; letter-spacing: normal;
}
.camada { overflow: hidden; pointer-events: none; color: var(--text); }
.codigo textarea {
  overflow: auto; resize: none; outline: none;
  background: transparent; color: transparent; -webkit-text-fill-color: transparent;
  caret-color: var(--accent);
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.codigo textarea::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.camada .p { color: var(--c-kw); }
.camada .t { color: var(--c-tipo); }
.camada .f { color: var(--c-fn); }
.camada .s { color: var(--c-str); }
.camada .n { color: var(--c-num); }
.camada .c { color: var(--c-com); font-style: italic; }
.camada .marca {
  position: absolute; left: 0; width: 100000px; height: var(--lh);
  background: color-mix(in srgb, var(--danger) 11%, transparent);
  box-shadow: inset 3px 0 0 var(--danger);
}

/* ---------- saída ---------- */
.lousa {
  flex: 1; min-height: 0; overflow: auto;
  background: var(--term-bg); color: var(--term-text);
  border: 1px solid var(--term-borda); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px 18px;
  font: var(--fs) / 1.6 var(--mono);
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent;
}
.lousa:focus-visible { outline-offset: -2px; }
.lousa pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
.lousa pre:empty::before {
  content: attr(data-vazio); color: var(--term-muted);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
}
.lousa .e { color: var(--term-err); }
.lousa .i { color: var(--term-input); }
.lousa .a { color: var(--term-warn); }
.lousa .s { color: var(--term-muted); }
.entrada { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.entrada .seta { color: var(--term-input); }
.entrada input {
  flex: 1; min-width: 0; font: inherit; color: var(--term-input);
  background: transparent; border: 0; border-bottom: 1px solid rgba(255, 255, 255, .2);
  padding: 2px 0; outline: none; transition: border-color .12s;
}
.entrada input::placeholder { color: var(--term-muted); }
.entrada input:focus { border-bottom-color: var(--term-input); }
.entrada button {
  height: 28px; padding: 0 11px; font-size: 12.5px; box-shadow: none;
  color: var(--term-text); background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .14);
}
.entrada button:hover:not(:disabled) { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .24); }

/* ---------- rodapé ---------- */
.rodape {
  display: flex; flex-wrap: wrap; gap: 6px 20px;
  padding-top: 8px; padding-bottom: 16px; font-size: 12.5px; color: var(--muted);
}
kbd {
  font: 11.5px/1 var(--mono); color: var(--text);
  padding: 2px 5px 1px; border: 1px solid var(--line-strong); border-bottom-width: 2px;
  border-radius: 5px; background: var(--surface);
}
@media (hover: none) { .rodape { display: none; } }

@media (max-width: 860px) {
  .wrap { padding-inline: 16px; }
  .topo { padding-top: 16px; }
  .topo p { display: none; }
  .rodape { display: none; }
  .github { margin-left: auto; }
  .barra { gap: 10px; }
  .grupo.acoes { order: -1; width: 100%; }
  .grupo.acoes button { flex: 1 1 auto; }
  .grupo.acoes .principal { flex: 2 1 auto; }
  .grupo.arquivos { width: 100%; }
  .grupo.arquivos .seletor { flex: 1 1 100%; }
  .grupo.arquivos select { width: 100%; max-width: none; }
  .grupo.arquivos button { flex: 1; }
  .paineis { grid-template-columns: 1fr; padding-bottom: 16px; }
  .editor { height: 56vh; min-height: 280px; flex: none; }
  .lousa { height: 40vh; min-height: 200px; flex: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="topo wrap">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8.5 11.5 12 7 15.5"/><path d="M13.5 16h4"/></svg>
    </span>
    <h1>Pseudocódigo <span>JS</span></h1>
  </div>
  <p> </p>
  <a class="github" href="https://github.com/wsleyweber/pseudocodigo">Projeto no GitHub</a>
</header>

<div class="barra wrap" role="toolbar" aria-label="Ações">
  <div class="grupo arquivos">
    <div class="seletor">
      <label class="visually-hidden" for="exemplos">Carregar um exemplo</label>
      <select id="exemplos"><option value="">Carregar exemplo</option></select>
    </div>
    <button id="abrir" type="button" title="Abrir um arquivo do computador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      Abrir
    </button>
    <button id="baixar" type="button" title="Baixar o algoritmo como arquivo .alg">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M5 19.5h14"/></svg>
      Baixar
    </button>
    <input id="arquivo" type="file" accept=".alg,.txt,.md,text/plain" hidden>
  </div>
  <div class="grupo acoes">
    <button id="verificar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7.5"/></svg>
      Verificar erros
    </button>
    <button id="parar" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
      Parar
    </button>
    <button id="executar" type="button" class="principal" title="Atalho: Ctrl+Enter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13a.6.6 0 0 0 .9.5l10.6-6.5a.6.6 0 0 0 0-1L7.9 5a.6.6 0 0 0-.9.5z"/></svg>
      Executar
    </button>
  </div>
</div>

<main class="paineis wrap">
  <section class="painel" aria-labelledby="t-codigo">
    <div class="cab"><h2 id="t-codigo">Algoritmo</h2></div>
    <div class="editor">
      <pre class="numeros" id="numeros" aria-hidden="true">1</pre>
      <div class="codigo">
        <pre class="camada" id="camada" aria-hidden="true"></pre>
        <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"
                  aria-label="Editor do algoritmo"></textarea>
      </div>
    </div>
  </section>

  <section class="painel" aria-labelledby="t-saida">
    <div class="cab">
      <h2 id="t-saida">Saída</h2>
      <span class="estado" id="estado" data-estado="pronto" role="status">Pronto</span>
    </div>
    <div class="lousa" id="lousa" role="log" aria-live="polite" tabindex="0">
      <pre id="saida" data-vazio="A saída do programa aparece aqui. Clique em Executar para começar."></pre>
      <form class="entrada" id="form-entrada" hidden>
        <span class="seta" aria-hidden="true">&rsaquo;</span>
        <input id="campo-entrada" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               aria-label="Valor pedido pelo programa" placeholder="Digite o valor e aperte Enter">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </section>
</main>

<footer class="rodape wrap">
  <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> executa</span>
  <span><kbd>Tab</kbd> recua o texto</span>
  <span><kbd>Shift</kbd> + <kbd>Tab</kbd> desfaz o recuo</span>
  <span><kbd>Esc</kbd> e depois <kbd>Tab</kbd> sai do editor</span>
</footer>

<script src="pseudo.js"></script>
<script>
(function () {
  'use strict';

  var P = window.Pseudo;
  var $ = function (id) { return document.getElementById(id); };

  // O interpretador (pseudo.js) é gerado por "npm run build:web" e precisa estar na mesma pasta
  // do index.html. Se não carregou, explica o que fazer em vez de quebrar com um erro de script.
  if (!P) { falhaDeCarga(); return; }

  function falhaDeCarga() {
    var msg = 'Não foi possível carregar o interpretador (pseudo.js).\n\n' +
      'Esse arquivo é gerado pelo build e não faz parte do código-fonte. Na pasta do projeto, rode:\n\n' +
      '    npm run build:web\n\n' +
      'Depois abra docs/index.html mantendo o pseudo.js na mesma pasta' +
      (location.protocol === 'file:' ? ' (de preferência por um servidor local, por exemplo: npx serve docs).' : '.');
    var span = document.createElement('span');
    span.className = 'e';
    span.textContent = msg;
    $('saida').appendChild(span);
    $('estado').textContent = 'Interpretador não carregado';
    $('estado').dataset.estado = 'erro';
    ['executar', 'verificar', 'parar', 'abrir', 'baixar', 'exemplos'].forEach(function (id) { $(id).disabled = true; });
  }

  var CHAVE = 'pseudocodigo-js:programa';
  var MAX_ITERACOES = 2000000;   // mais baixo que o do terminal: um laço infinito é detectado em ~1 s
  var MAX_SAIDA = 300000;        // caracteres; evita travar a página com um laço que escreve sem parar

  var INICIAL =
    'ALGORITMO OLA:\n' +
    '    DECLARE NOME : CARACTERES;\n' +
    'INICIO\n' +
    '    ESCREVA("Qual é o seu nome?");\n' +
    '    LEIA(NOME);\n' +
    '    ESCREVA("Olá,", NOME);\n' +
    'FIMALGORITMO\n';

  // Títulos com acento para os exemplos conhecidos; os novos usam o nome do arquivo.
  var TITULOS = {
    '01_fahrenheit': 'Fahrenheit para Celsius',
    '02_mes_se': 'Nome do mês com SE',
    '03_escolha_mes': 'Nome do mês com ESCOLHA',
    '04_enquanto': 'Contagem com ENQUANTO',
    '05_repita': 'Contagem com REPITA',
    '06_para_tabuada': 'Tabuada com PARA',
    '07_bhaskara': 'Equação do 2º grau (Bhaskara)',
    '08_tipos_e_funcoes': 'Tipos e funções',
    '16_vetor_notas': 'Vetor: notas da turma',
    '17_funcoes_e_procedimentos': 'Funções e procedimentos',
    '18_matriz_busca': 'Matriz e busca'
  };

  var el = {
    editor: $('editor'), camada: $('camada'), numeros: $('numeros'),
    saida: $('saida'), lousa: $('lousa'), estado: $('estado'),
    form: $('form-entrada'), campo: $('campo-entrada'),
    executar: $('executar'), parar: $('parar'), verificar: $('verificar'),
    abrir: $('abrir'), baixar: $('baixar'), arquivo: $('arquivo'), exemplos: $('exemplos')
  };

  /* ---------------- realce de sintaxe ---------------- */

  var pal = P.palavras;
  var TIPOS = new Set(pal.NOMES_TIPOS);
  var OPERADORES = new Set(['E', 'OU', 'NAO', 'DIV', 'MOD']);
  var CONSTANTES = new Set(['VERDADEIRO', 'FALSO', 'PI']);
  var TOKEN = /\/\*[\s\S]*?(?:\*\/|$)|(?:#|\/\/)[^\n]*|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|\d+(?:\.\d+)?|[\p{L}_][\p{L}\p{N}_]*/gu;

  function escapar(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function classeDe(t) {
    var c = t[0];
    if (c === '#' || c === '/') return 'c';
    if (c === '"' || c === "'") return 's';
    if (c >= '0' && c <= '9') return 'n';
    var n = pal.normalizar(t);
    if (TIPOS.has(n)) return 't';
    if (pal.NOMES_FUNCOES.has(n)) return 'f';
    if (CONSTANTES.has(n)) return 'n';
    if (OPERADORES.has(n) || pal.RESERVADAS.has(n)) return 'p';
    return null;
  }

  function destacar(codigo) {
    var html = '', ultimo = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(codigo))) {
      html += escapar(codigo.slice(ultimo, m.index));
      var cls = classeDe(m[0]);
      html += cls ? '<span class="' + cls + '">' + escapar(m[0]) + '</span>' : escapar(m[0]);
      ultimo = m.index + m[0].length;
    }
    return html + escapar(codigo.slice(ultimo));
  }

  var linhaComErro = null;

  function atualizarEditor() {
    var texto = el.editor.value;
    var qtd = texto.split('\n').length;
    var marca = '';
    if (linhaComErro && linhaComErro <= qtd) {
      marca = '<i class="marca" style="top:calc(var(--pad) + ' + (linhaComErro - 1) + ' * var(--lh))"></i>';
    }
    el.camada.innerHTML = marca + destacar(texto) + '\n ';

    var nums = '';
    for (var i = 1; i <= qtd; i++) {
      nums += (i === linhaComErro ? '<span class="erro">' + i + '</span>' : i) + (i < qtd ? '\n' : '');
    }
    el.numeros.innerHTML = nums;
    el.numeros.style.setProperty('--ndig', Math.max(2, String(qtd).length));
    sincronizarRolagem();
  }

  function sincronizarRolagem() {
    el.camada.scrollTop = el.editor.scrollTop;
    el.camada.scrollLeft = el.editor.scrollLeft;
    el.numeros.scrollTop = el.editor.scrollTop;
  }

  function marcarErro(linha) {
    linhaComErro = linha || null;
    atualizarEditor();
  }

  /* ---------------- edição: Tab, Enter e recuo ---------------- */

  var soltarTab = false;

  function inserir(texto) {
    el.editor.focus();
    if (!document.execCommand('insertText', false, texto)) {
      el.editor.setRangeText(texto, el.editor.selectionStart, el.editor.selectionEnd, 'end');
      el.editor.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  function recuar(desfazer) {
    var v = el.editor.value, ini = el.editor.selectionStart, fim = el.editor.selectionEnd;
    var iniLinha = v.lastIndexOf('\n', ini - 1) + 1;
    var fimLinha = (fim > ini && v[fim - 1] === '\n') ? fim - 1 : v.indexOf('\n', fim);
    if (fimLinha === -1) fimLinha = v.length;
    var novo = v.slice(iniLinha, fimLinha).split('\n').map(function (l) {
      return desfazer ? l.replace(/^( {1,4}|\t)/, '') : '    ' + l;
    }).join('\n');
    el.editor.setSelectionRange(iniLinha, fimLinha);
    inserir(novo);
    el.editor.setSelectionRange(iniLinha, iniLinha + novo.length);
  }

  el.editor.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    if (e.key === 'Escape') { soltarTab = true; return; }
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      if (soltarTab) return;                       // Esc + Tab: deixa o foco sair do editor
      e.preventDefault();
      var multilinha = el.editor.value.slice(el.editor.selectionStart, el.editor.selectionEnd).indexOf('\n') !== -1;
      if (multilinha || e.shiftKey) recuar(e.shiftKey);
      else inserir('    ');
      return;
    }

    if (e.key === 'Backspace' && e.ctrlKey && !e.altKey && !e.metaKey) {
      // Ctrl+Backspace sobre o recuo: apaga só até 4 espaços, sem juntar com a linha de cima.
      var t = el.editor, p0 = t.selectionStart;
      if (p0 === t.selectionEnd) {
        var ls = t.value.lastIndexOf('\n', p0 - 1) + 1;
        var antes = t.value.slice(ls, p0);
        if (antes && /^ +$/.test(antes)) {
          e.preventDefault();
          t.setSelectionRange(p0 - Math.min(4, antes.length), p0);
          if (!document.execCommand('delete')) {
            t.setRangeText('', t.selectionStart, t.selectionEnd, 'end');
            t.dispatchEvent(new Event('input', { bubbles: true }));
          }
          return;
        }
      }
    }

    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
      var v = el.editor.value, pos = el.editor.selectionStart;
      var ini = v.lastIndexOf('\n', pos - 1) + 1;
      var recuo = /^[ \t]*/.exec(v.slice(ini, pos))[0];
      if (recuo) { e.preventDefault(); inserir('\n' + recuo); }
    }
  });
  el.editor.addEventListener('blur', function () { soltarTab = false; });

  var modificado = false, salvarTimer = null;

  el.editor.addEventListener('input', function () {
    modificado = true;
    if (linhaComErro) linhaComErro = null;
    atualizarEditor();
    clearTimeout(salvarTimer);
    salvarTimer = setTimeout(salvarLocal, 400);
  });
  el.editor.addEventListener('scroll', sincronizarRolagem);

  function salvarLocal() {
    try { localStorage.setItem(CHAVE, el.editor.value); } catch (e) { /* sem armazenamento: tudo bem */ }
  }
  function lerLocal() {
    try { return localStorage.getItem(CHAVE); } catch (e) { return null; }
  }

  function definirCodigo(texto) {
    el.editor.value = texto.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    el.editor.setSelectionRange(0, 0);
    el.editor.scrollTop = 0; el.editor.scrollLeft = 0;
    modificado = false;
    linhaComErro = null;
    atualizarEditor();
    salvarLocal();
  }

  /* ---------------- saída e entrada (LEIA) ---------------- */

  var ESTADOS = {
    pronto: 'Pronto', executando: 'Executando', entrada: 'Aguardando valor',
    ok: 'Finalizado', erro: 'Com erro', parado: 'Interrompido'
  };
  function definirEstado(chave) {
    el.estado.dataset.estado = chave === 'parado' ? 'pronto' : chave;
    el.estado.textContent = ESTADOS[chave];
  }

  var rolagemPendente = false;
  function rolarFim() {
    if (rolagemPendente) return;
    rolagemPendente = true;
    requestAnimationFrame(function () {
      rolagemPendente = false;
      el.lousa.scrollTop = el.lousa.scrollHeight;
    });
  }

  function acrescentar(texto, classe) {
    var no = document.createTextNode(texto);
    if (classe) {
      var span = document.createElement('span');
      span.className = classe;
      span.appendChild(no);
      el.saida.appendChild(span);
    } else {
      el.saida.appendChild(no);
    }
    rolarFim();
  }

  function separador() { return el.saida.textContent ? '\n' : ''; }

  function limparSaida() {
    el.saida.textContent = '';
    esconderEntrada();
  }

  function esconderEntrada() { el.form.hidden = true; el.campo.value = ''; }

  function criarES(controlador, estado) {
    var total = 0;
    return {
      escrever: function (texto) {
        if (estado.cortado) return;
        total += texto.length;
        if (total > MAX_SAIDA) {
          estado.cortado = true;
          acrescentar(separador() + 'Saída muito longa (mais de ' + MAX_SAIDA.toLocaleString('pt-BR') +
            ' caracteres). A execução foi interrompida: confira se há um laço que nunca termina.\n', 'e');
          controlador.abort();
          return;
        }
        acrescentar(texto);
      },
      avisar: function (texto) { acrescentar(texto, 'a'); },
      lerLinha: function () {
        return new Promise(function (resolver, rejeitar) {
          var sinal = controlador.signal;
          function aoAbortar() {
            el.form.onsubmit = null;
            esconderEntrada();
            rejeitar(new DOMException('Interrompido', 'AbortError'));
          }
          if (sinal.aborted) { aoAbortar(); return; }
          sinal.addEventListener('abort', aoAbortar, { once: true });
          definirEstado('entrada');
          el.form.hidden = false;
          rolarFim();
          el.campo.focus();
          el.form.onsubmit = function (ev) {
            ev.preventDefault();
            var valor = el.campo.value;
            sinal.removeEventListener('abort', aoAbortar);
            el.form.onsubmit = null;
            esconderEntrada();
            acrescentar(valor + '\n', 'i');
            definirEstado('executando');
            resolver(valor);
          };
        });
      }
    };
  }

  /* ---------------- executar, parar e verificar ---------------- */

  var execucao = null;

  function aoMudarExecucao() {
    var rodando = execucao !== null;
    el.executar.disabled = rodando;
    el.verificar.disabled = rodando;
    el.parar.disabled = !rodando;
    el.exemplos.disabled = rodando;
    el.abrir.disabled = rodando;
  }

  function mostrarErro(e, fonte) {
    if (e instanceof P.PseudoError) {
      acrescentar(separador() + P.formatarErro(e, fonte) + '\n', 'e');
      if (e.linha) marcarErro(e.linha);
    } else {
      acrescentar(separador() + 'Erro interno do interpretador: ' + (e && e.message ? e.message : e) + '\n', 'e');
      if (window.console) console.error(e);
    }
  }

  function executar() {
    if (execucao) return;
    var fonte = el.editor.value.replace(/^\uFEFF/, '');
    var controlador = new AbortController();
    var estado = { cortado: false };
    execucao = { controlador: controlador };
    aoMudarExecucao();
    limparSaida();
    marcarErro(null);
    definirEstado('executando');

    P.executar(fonte, criarES(controlador, estado), { sinal: controlador.signal, maxIteracoes: MAX_ITERACOES })
      .then(function () {
        if (estado.cortado) { definirEstado('erro'); return; }
        acrescentar(separador() + 'Programa finalizado.\n', 's');
        definirEstado('ok');
      })
      .catch(function (e) {
        if (estado.cortado) { definirEstado('erro'); return; }
        if (e && e.name === 'AbortError') {
          acrescentar(separador() + 'Execução interrompida.\n', 's');
          definirEstado('parado');
          return;
        }
        if (controlador.signal.aborted && e instanceof P.PseudoError && e.tipo === 'Execução interrompida') {
          acrescentar(separador() + 'Execução interrompida (linha ' + e.linha + ').\n', 's');
          definirEstado('parado');
          if (e.linha) marcarErro(e.linha);
          return;
        }
        mostrarErro(e, fonte);
        definirEstado('erro');
      })
      .then(function () {
        execucao = null;
        esconderEntrada();
        aoMudarExecucao();
      });
  }

  function parar() { if (execucao) execucao.controlador.abort(); }

  function verificar() {
    if (execucao) return;
    var fonte = el.editor.value.replace(/^\uFEFF/, '');
    limparSaida();
    marcarErro(null);
    try {
      var avisos = P.compilar(fonte).avisos || [];
      avisos.forEach(function (a) { acrescentar(P.formatarErro(a, fonte) + '\n\n', 'a'); });
      acrescentar(avisos.length ? 'Nenhum erro, mas ' + avisos.length + ' aviso(s).\n' : 'Nenhum erro encontrado.\n', 's');
      definirEstado('ok');
    } catch (e) {
      mostrarErro(e, fonte);
      definirEstado('erro');
    }
  }

  el.executar.addEventListener('click', executar);
  el.parar.addEventListener('click', parar);
  el.verificar.addEventListener('click', verificar);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); executar(); }
  });

  /* ---------------- exemplos, abrir e baixar ---------------- */

  function confirmarSubstituicao() {
    if (!modificado || !el.editor.value.trim()) return true;
    return window.confirm('Substituir o algoritmo atual? As alterações que você fez no editor serão perdidas.');
  }

  var nomeArquivo = 'programa.alg';

  (P.EXEMPLOS || []).forEach(function (ex, i) {
    var base = ex.arquivo.replace(/\.[^.]+$/, '');
    var titulo = TITULOS[base] || base.replace(/^\d+_/, '').replace(/_/g, ' ');
    var op = document.createElement('option');
    op.value = String(i);
    op.textContent = titulo.charAt(0).toUpperCase() + titulo.slice(1);
    el.exemplos.appendChild(op);
  });

  el.exemplos.addEventListener('change', function () {
    var ex = P.EXEMPLOS[Number(el.exemplos.value)];
    el.exemplos.value = '';
    if (!ex || !confirmarSubstituicao()) return;
    nomeArquivo = ex.arquivo;
    definirCodigo(ex.codigo);
    limparSaida();
    definirEstado('pronto');
    el.editor.focus({ preventScroll: true });
  });

  el.abrir.addEventListener('click', function () { el.arquivo.click(); });
  el.arquivo.addEventListener('change', function () {
    var f = el.arquivo.files && el.arquivo.files[0];
    el.arquivo.value = '';
    if (!f || !confirmarSubstituicao()) return;
    var leitor = new FileReader();
    leitor.onload = function () {
      nomeArquivo = f.name;
      definirCodigo(String(leitor.result));
      limparSaida();
      definirEstado('pronto');
    };
    leitor.readAsText(f, 'utf-8');
  });

  el.baixar.addEventListener('click', function () {
    var blob = new Blob([el.editor.value], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = /\.(alg|txt|md)$/i.test(nomeArquivo) ? nomeArquivo : 'programa.alg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  /* ---------------- início ---------------- */

  var guardado = lerLocal();
  definirCodigo(guardado !== null && guardado.trim() ? guardado : INICIAL);
  definirEstado('pronto');
  aoMudarExecucao();
})();
</script>
</body>
</html>
